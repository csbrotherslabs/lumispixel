name: Deploy Cloudflare Media Worker (Dev)

on:
  push:
    branches:
      - dev
    paths:
      - "cloudflare/media-worker/**"
      - ".github/workflows/deploy-cloudflare-media-dev.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-media-dev
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy lumispixel-media-dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cloudflare/media-worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Install Worker dependencies
        run: npm install

      - name: Validate Cloudflare configuration
        run: |
          test -n "$CLOUDFLARE_API_TOKEN" || (echo "CLOUDFLARE_API_TOKEN is not configured" && exit 1)
          test -n "$CLOUDFLARE_ACCOUNT_ID" || (echo "CLOUDFLARE_ACCOUNT_ID is not configured" && exit 1)

      - name: Deploy development media Worker
        run: npx wrangler deploy
