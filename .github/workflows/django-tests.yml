name: Django CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-tests:
    name: PostgreSQL database checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumispixel_ci
          POSTGRES_USER: lumispixel
          POSTGRES_PASSWORD: lumispixel_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumispixel -d lumispixel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      DATABASE_URL: "postgresql://lumispixel:lumispixel_ci_password@127.0.0.1:5432/lumispixel_ci"
      DB_SSL_REQUIRE: "0"
      GALLERY_STORAGE_BACKEND: "local"
      GALLERY_STORAGE_ENVIRONMENT: "dev"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify PostgreSQL test connection
        run: |
          python - <<'PY'
          from django.db import connection
          assert connection.vendor == "postgresql", connection.vendor
          PY
      - name: Apply migrations on PostgreSQL
        run: python manage.py migrate --noinput
      - name: Check migration consistency on PostgreSQL
        run: python manage.py makemigrations --check --dry-run
      - name: Run database integrity tests on PostgreSQL
        run: python manage.py test config.test_database_production --verbosity 2

  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      GALLERY_STORAGE_BACKEND: "local"
      GALLERY_STORAGE_ENVIRONMENT: "dev"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install browser for golden-path tests
        run: python -m playwright install --with-deps chromium

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Validate production static asset build
        env:
          DJANGO_SETTINGS_MODULE: "config.settings"
          DJANGO_STATICFILES_STORAGE: "whitenoise.storage.CompressedManifestStaticFilesStorage"
        run: |
          python manage.py collectstatic --noinput --clear
          python manage.py test config.test_static_deployment --verbosity 2

      - name: Audit brittle test contracts
        run: python scripts/audit_test_contracts.py

      - name: Run Django test suite
        run: python manage.py test --verbosity 2
