name: Django CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  postgres-tests:
    name: PostgreSQL 16 first-class test suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumispixel_ci
          POSTGRES_USER: lumispixel
          POSTGRES_PASSWORD: lumispixel_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumispixel -d lumispixel_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      DATABASE_URL: "postgresql://lumispixel:lumispixel_ci_password@127.0.0.1:5432/lumispixel_ci"
      DB_SSL_REQUIRE: "0"
      GALLERY_STORAGE_BACKEND: "local"
      GALLERY_STORAGE_ENVIRONMENT: "dev"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Verify PostgreSQL 16 connection
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", connection.vendor
          with connection.cursor() as cursor:
              cursor.execute("SHOW server_version_num")
              version = int(cursor.fetchone()[0])
          assert 160000 <= version < 170000, version
          print(f"PostgreSQL server_version_num={version}")
          PY
      - name: Prove clean database migration graph
        run: |
          python manage.py migrate --noinput
          python manage.py migrate --plan
          python manage.py showmigrations --plan
      - name: Fail on model or migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Run PostgreSQL database and transaction contracts
        run: |
          python manage.py test \
            config.test_database_production \
            config.test_postgresql_behavior \
            --verbosity 2
      - name: Run critical customer workflows on PostgreSQL
        run: python manage.py test apps.galleries.test_critical_workflows --verbosity 2
      - name: Run full Django suite on PostgreSQL
        run: python manage.py test --verbosity 2

  browser-e2e:
    name: P3 Playwright Chromium golden paths
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumispixel_e2e
          POSTGRES_USER: lumispixel
          POSTGRES_PASSWORD: lumispixel_e2e_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumispixel -d lumispixel_e2e"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-e2e-secret-key"
      DATABASE_URL: "postgresql://lumispixel:lumispixel_e2e_password@127.0.0.1:5432/lumispixel_e2e"
      DB_SSL_REQUIRE: "0"
      GALLERY_STORAGE_BACKEND: "local"
      GALLERY_STORAGE_ENVIRONMENT: "dev"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install application dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Verify PostgreSQL 16
        run: |
          python - <<'PY'
          import django
          django.setup()
          from django.db import connection
          assert connection.vendor == "postgresql", connection.vendor
          with connection.cursor() as cursor:
              cursor.execute("SHOW server_version_num")
              version = int(cursor.fetchone()[0])
          assert 160000 <= version < 170000, version
          print(f"PostgreSQL server_version_num={version}")
          PY
      - name: Apply production migration graph
        run: python manage.py migrate --noinput
      - name: Run onboarding persistence contracts
        run: |
          python manage.py test \
            apps.photographers.tests.PhotographerOnboardingBehaviorTests \
            --verbosity 2
      # apps/galleries has a legacy tests.py module alongside an intentionally
      # non-package tests/ directory. Django supports directory labels but not
      # individual file labels, so isolate each browser module with --pattern.
      - name: Run photographer-to-client golden path
        run: python manage.py test apps/galleries/tests --pattern=test_delivery_golden_path.py --verbosity 2
      - name: Run mobile client gallery journeys
        run: python manage.py test apps/galleries/tests --pattern=test_client_mobile_designs.py --verbosity 2
      - name: Run client access-control browser matrix
        run: python manage.py test apps/galleries/tests --pattern=test_client_permission_browser_matrix.py --verbosity 2

  django-tests:
    name: Django tests (fast SQLite feedback)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      GALLERY_STORAGE_BACKEND: "local"
      GALLERY_STORAGE_ENVIRONMENT: "dev"
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install browser for golden-path tests
        run: python -m playwright install --with-deps chromium
      - name: Run Django system checks
        run: python manage.py check
      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run
      - name: Validate production static asset build
        env:
          DJANGO_SETTINGS_MODULE: "config.settings"
          DJANGO_STATICFILES_STORAGE: "whitenoise.storage.CompressedManifestStaticFilesStorage"
        run: |
          python manage.py collectstatic --noinput --clear
          python manage.py test config.test_static_deployment --verbosity 2
      - name: Audit brittle test contracts
        run: python scripts/audit_test_contracts.py
      - name: Run Django test suite
        run: python manage.py test --verbosity 2
