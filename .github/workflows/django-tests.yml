name: Django CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: django-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  django-tests:
    name: Django tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      DJANGO_SETTINGS_MODULE: "config.settings_test"
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: "ci-only-secret-key"
      USE_SPACES: "0"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

      - name: Verify committed migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Audit brittle test contracts
        run: python scripts/audit_test_contracts.py

      - name: Run Django test suite
        run: python manage.py test --verbosity 2
