name: Email Architecture Guard
on:
  pull_request:
  push:
    branches: [dev, main]
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s scripts/tests -p test_email_architecture.py
      - run: python scripts/check_email_architecture.py
