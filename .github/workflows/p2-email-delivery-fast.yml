name: P2 Email Delivery Fast Gate

on:
  pull_request:
    paths:
      - 'apps/notifications/**'
      - '.github/workflows/p2-email-delivery-fast.yml'

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Migration drift check
        run: python manage.py makemigrations --check --dry-run
      - name: Focused P2 tests
        run: python manage.py test apps.notifications.test_delivery_reliability apps.notifications.test_email_delivery -v 2
