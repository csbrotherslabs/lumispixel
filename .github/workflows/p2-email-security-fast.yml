name: P2 Email Security Fast Gate

on:
  pull_request:
    paths:
      - 'apps/notifications/**'
      - 'config/settings.py'
      - '.github/workflows/p2-email-security-fast.yml'

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      DJANGO_SETTINGS_MODULE: config.settings
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Django system check
        run: python manage.py check
      - name: Focused security/content tests
        run: python manage.py test apps.notifications.test_security_content_correctness -v 2
