name: P2 Operations Reliability Gate

on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]

permissions:
  contents: read

concurrency:
  group: p2-operations-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  operational-contracts:
    name: Health, recovery and production contracts
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      GALLERY_STORAGE_BACKEND: local
      GALLERY_STORAGE_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enforce committed migration state
        run: python manage.py makemigrations --check --dry-run
      - name: Run health and failure-injection contracts
        run: |
          python manage.py test \
            config.test_deployment_health \
            apps.core.test_operations_observability \
            config.test_reliability_failure_isolation \
            apps.galleries.test_recovery_degraded \
            --verbosity 2
      - name: Run recovery and migration-safety contracts
        run: |
          python manage.py test \
            apps.core.test_database_restore_verification \
            apps.core.test_deployment_preflight \
            config.test_celery_reliability \
            --verbosity 2
      - name: Enforce production configuration contract
        run: python manage.py test config.test_production_configuration --verbosity 2

  postgres-operational-gate:
    name: PostgreSQL migration and restore gate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: lumispixel_ops_ci
          POSTGRES_USER: lumispixel
          POSTGRES_PASSWORD: lumispixel_ops_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lumispixel -d lumispixel_ops_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      DJANGO_DEBUG: "1"
      DJANGO_SECRET_KEY: ci-only-secret-key
      DATABASE_URL: postgresql://lumispixel:lumispixel_ops_ci_password@127.0.0.1:5432/lumispixel_ops_ci
      DB_SSL_REQUIRE: "0"
      GALLERY_STORAGE_BACKEND: local
      GALLERY_STORAGE_ENVIRONMENT: dev
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Apply production-shaped migration graph
        run: python manage.py migrate --noinput
      - name: Fail on model/migration drift
        run: python manage.py makemigrations --check --dry-run
      - name: Require clean deployment preflight
        run: python manage.py deployment_preflight
      - name: Prove restored database integrity contract
        run: python manage.py verify_database_restore
