{% extends "base.html" %}
{% block title %}Password Reset Complete | LumisPixel{% endblock %}
{% block content %}
<section class="wptb-about-one bg-image-2 lumis-auth-section" aria-labelledby="password-reset-complete-title">
  <div class="container">
    <div class="wptb-heading">
      <div class="wptb-item--inner text-center">
        <h1 class="wptb-item--title" id="password-reset-complete-title">Your password has been reset</h1>
        <p class="wptb-item--description">You can now sign in to LumisPixel with your new password.</p>
      </div>
    </div>
    <div class="text-center lumis-auth-actions lumis-auth-actions--centered">
      <a class="btn lumis-auth-primary" href="{% url 'accounts:login' %}"><span class="btn-wrap"><span class="text-first">Back to Login</span></span></a>
    </div>
  </div>
</section>
{% endblock %}
