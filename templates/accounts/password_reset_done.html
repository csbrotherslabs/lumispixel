{% extends "base.html" %}
{% block title %}Check Your Email | LumisPixel{% endblock %}
{% block content %}
<section class="wptb-about-one bg-image-2 lumis-auth-section" aria-labelledby="password-reset-done-title">
  <div class="container">
    <div class="wptb-heading">
      <div class="wptb-item--inner text-center">
        <h1 class="wptb-item--title" id="password-reset-done-title">Check your email</h1>
        <p class="wptb-item--description">If the email address you entered belongs to an eligible LumisPixel account, password reset instructions will arrive shortly.</p>
      </div>
    </div>
    <div class="text-center lumis-auth-actions lumis-auth-actions--centered">
      <a class="btn lumis-auth-secondary" href="{% url 'accounts:login' %}"><span class="btn-wrap"><span class="text-first">Return to Sign In</span></span></a>
    </div>
  </div>
</section>
{% endblock %}
