{% if comment.can_delete_for_viewer %}
<form class="lp-client-comment-delete" method="post" action="{% if is_gallery_owner %}{% url 'galleries:owner_gallery_comment_delete' gallery.public_id photo.pk comment.pk %}{% else %}{% url 'galleries:client_gallery_comment_delete' access_token photo.pk comment.pk %}{% endif %}" data-client-comment-delete data-photo-id="{{ photo.pk }}">{% csrf_token %}<button type="submit" aria-label="Delete your comment">Delete</button><span role="status" data-comment-delete-status></span></form>
{% endif %}
