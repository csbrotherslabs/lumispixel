<dialog class="lp-photo-lightbox lp-viewer" data-photo-lightbox data-share-url="{{ stable_gallery_url }}" data-photographer-website="{{ gallery.photographer.gallery_website_url }}" {% if request.user.is_authenticated %}data-can-like-comments{% endif %} aria-label="Photo viewer">{% csrf_token %}
  <header class="lp-viewer__toolbar">
    <div class="lp-viewer__download-group" data-viewer-download-group hidden>
    <details class="lp-viewer-download-menu"><summary>Download ▾</summary><div class="lp-viewer-download-options">
      <label class="sr-only" for="viewer-size">Download size</label><select id="viewer-size" name="viewer-size"><option value="small">Small</option><option value="medium">Medium</option><option value="large" selected>Large</option></select>
      <a data-viewer-download><span data-viewer-download-label>Download Large</span></a>
      <a data-viewer-original hidden>Original</a>
    </div></details>
    </div>
    <button type="button" data-zoom-out aria-label="Zoom out">−</button><output data-zoom-level>100%</output><button type="button" data-zoom-in aria-label="Zoom in">+</button><button type="button" data-zoom-fit>Fit</button>
    <button type="button" data-photo-lightbox-close aria-label="Close full view">×</button>
  </header>
  <div class="lp-viewer__body">
    <section class="lp-viewer__stage" aria-label="Photograph">
      <button type="button" data-viewer-prev aria-label="Previous photo">‹</button>
      <div class="lp-viewer-scroll"><div class="lp-gallery-watermark-media"><img data-photo-lightbox-image alt="Full view gallery photograph">{% include "galleries/components/tiled_watermark.html" %}</div></div>
      <button type="button" data-viewer-next aria-label="Next photo">›</button>
    </section>
    <aside id="viewer-comments" class="lp-viewer__comments" hidden aria-label="Photo comments"><header><h2>Comments <span class="lp-comment-total" data-viewer-thread-count>0</span></h2><button type="button" data-viewer-comments-close aria-label="Close comments">×</button></header><div data-viewer-thread></div></aside>
  </div>
  <footer class="lp-viewer__toolbar lp-viewer__footer">{% if can_share_gallery %}<button type="button" data-viewer-share>Share</button>{% endif %}    <button type="button" data-viewer-favorite hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8Z"/></svg> Favorite <span data-viewer-favorite-count>0</span></button>
    <button type="button" data-viewer-comments hidden aria-expanded="false" aria-controls="viewer-comments"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.5 9.4 9.4 0 0 1-4-.9L3 21l1.7-4.6A8.5 8.5 0 1 1 21 11.5Z"/></svg> Comments <span data-viewer-comment-count>0</span></button>
<span role="status" data-viewer-status></span></footer>
</dialog>
