{% load static %}
{% if semantic_search_available %}
<link rel="stylesheet" href="{% static 'css/client_gallery_semantic_search.css' %}">
<section class="lp-semantic-client" aria-label="AI photo search" data-semantic-client>
  <div class="lp-semantic-client__panel" data-semantic-panel hidden>
    <header><div><h2 data-semantic-heading>AI photo search</h2><small>Closest matches first</small></div><button type="button" data-semantic-view-all hidden aria-pressed="false">View all matches</button><button type="button" data-semantic-dismiss aria-label="Close AI search">×</button></header>
    <p class="lp-semantic-client__status" data-semantic-status role="status" aria-live="polite" aria-atomic="true"></p>
  <template data-semantic-watermark>{% include "galleries/components/tiled_watermark.html" %}</template>
  <ol class="lp-semantic-client__results" data-semantic-results aria-label="Photos ranked by relevance" aria-busy="false" hidden></ol>
  </div>
  <div class="lp-semantic-client__dock">
  <form class="lp-semantic-client__form" id="lp-semantic-form" data-semantic-client-form hidden data-search-url="{% if access_token %}{% url 'visual_search:invited-semantic-search' access_token %}{% else %}{% url 'visual_search:public-semantic-search' gallery.public_id %}{% endif %}">
    <label class="lp-semantic-client__sr" for="lp-semantic-query">What would you like to find?</label>
    <svg class="lp-semantic-client__input-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z"/></svg>
    <input id="lp-semantic-query" name="q" type="search" minlength="2" maxlength="200" placeholder="Describe a moment…" required aria-describedby="lp-semantic-hint">
    <span id="lp-semantic-hint" class="lp-semantic-client__sr">Search this gallery. Closest matches appear first.</span>
    <button type="button" data-semantic-clear hidden aria-label="Clear search" title="Clear search">×</button>
    <button type="submit" data-semantic-submit aria-label="Search photos" title="Search photos"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 18-8-8 18-2-8Z M11 13 21 3"/></svg></button>
  </form>
  <button type="button" class="lp-semantic-client__toggle" data-semantic-toggle aria-label="AI photo search" title="AI photo search" aria-expanded="false" aria-controls="lp-semantic-form"><svg viewBox="0 0 28 28" aria-hidden="true"><path d="m11 5 3 7 7 3-7 3-3 7-3-7-7-3 7-3Z M22 1l1.5 4.5L28 7l-4.5 1.5L22 13l-1.5-4.5L16 7l4.5-1.5Z"/></svg></button>
  </div>
  <dialog class="lp-semantic-client__preview" data-semantic-preview aria-label="Search result preview">
    <button type="button" data-semantic-close aria-label="Close photo preview">Close</button>
    <div class="lp-gallery-watermark-media"><img data-semantic-preview-image alt="">{% include "galleries/components/tiled_watermark.html" %}</div>
    <p data-semantic-preview-caption></p>
  </dialog>
</section>
<script src="{% static 'js/client_gallery_semantic_search.js' %}" defer></script>
{% endif %}
