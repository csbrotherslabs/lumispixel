{% load static %}
{% if semantic_search_available %}
<link rel="stylesheet" href="{% static 'css/client_gallery_semantic_search.css' %}">
<section class="lp-semantic-client" aria-labelledby="lp-semantic-title" data-semantic-client>
  <header class="lp-semantic-client__heading">
    <div><h2 id="lp-semantic-title">Find your favorite moments</h2><p>Describe a scene, detail, or moment in this gallery.</p></div>
    <span class="lp-semantic-client__badge">AI photo search</span>
  </header>
  <form class="lp-semantic-client__form" data-semantic-client-form data-search-url="{% if access_token %}{% url 'visual_search:invited-semantic-search' access_token %}{% else %}{% url 'visual_search:public-semantic-search' gallery.public_id %}{% endif %}">
    <label for="lp-semantic-query">What would you like to find?</label>
    <div class="lp-semantic-client__controls">
      <input id="lp-semantic-query" name="q" type="search" minlength="2" maxlength="200" placeholder="Try “people dancing” or “cake on a table”" required aria-describedby="lp-semantic-hint">
      <button type="submit" data-semantic-submit>Search photos</button>
      <button type="button" class="lp-semantic-client__clear" data-semantic-clear hidden>Clear search</button>
    </div>
    <p id="lp-semantic-hint" class="lp-semantic-client__hint">Results appear below, with the closest matches first.</p>
  </form>
  <p class="lp-semantic-client__status" data-semantic-status role="status" aria-live="polite" aria-atomic="true"></p>
  <template data-semantic-watermark>{% include "galleries/components/tiled_watermark.html" %}</template>
  <ol class="lp-semantic-client__results" data-semantic-results aria-label="Photos ranked by relevance" aria-busy="false" hidden></ol>
  <dialog class="lp-semantic-client__preview" data-semantic-preview aria-label="Search result preview">
    <button type="button" data-semantic-close aria-label="Close photo preview">Close</button>
    <div class="lp-gallery-watermark-media"><img data-semantic-preview-image alt="">{% include "galleries/components/tiled_watermark.html" %}</div>
    <p data-semantic-preview-caption></p>
  </dialog>
</section>
<script src="{% static 'js/client_gallery_semantic_search.js' %}" defer></script>
{% endif %}
