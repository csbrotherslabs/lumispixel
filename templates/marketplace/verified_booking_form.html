{% load static %}
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ heading }} | LumisPixel</title><link rel="stylesheet" href="{% static 'css/main.css' %}"></head><body><main style="max-width:600px;margin:48px auto;padding:24px"><h1>{{ heading }}</h1>{% if success %}<p>Your request is tentative until the photographer confirms it. No payment has been collected.</p>{% else %}<form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn btn-primary" type="submit">Submit</button></form>{% endif %}<p><a href="{% url 'public-photographer-website' slug=slug %}">Return to photographer website</a></p></main></body></html>
