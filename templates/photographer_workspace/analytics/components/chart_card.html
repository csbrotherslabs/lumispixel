<article class="lpa-card lpa-chart-card {{ card_class|default:'' }}">
  <header><div><span class="lpa-eyebrow">{{ eyebrow }}</span><h3>{{ title }}</h3><p>{{ description }}</p></div><button class="lpa-icon-btn" type="button" aria-label="More options for {{ title }}"><i class="bi bi-three-dots"></i></button></header>
  <div class="lpa-chart-legend"><span><i></i>Current period</span><span><i class="is-compare"></i>Previous period</span></div>
  <div class="lpa-placeholder-chart" role="img" aria-label="Placeholder chart for {{ title }}"><span style="height:34%"></span><span style="height:48%"></span><span style="height:41%"></span><span style="height:64%"></span><span style="height:58%"></span><span style="height:78%"></span><span style="height:70%"></span><span style="height:88%"></span></div>
  <div class="lpa-chart-axis"><span>Week 1</span><span>Week 2</span><span>Week 3</span><span>Week 4</span></div>
</article>
