<button type="button" class="lpw-calendar-event lpw-calendar-event--{{ event.kind }}{% if event.warning %} has-warning{% endif %}" data-schedule-event="{{ event.drawer_id }}" aria-haspopup="dialog" aria-label="View details: {% if event.all_day %}All day{% else %}{{ event.starts_at|date:'g:i A' }}{% endif %}, {{ event.name }}, {{ event.session_type }}, {{ event.photographer }}, {{ event.status }}{% if event.warning %}, action required{% endif %}">
  <i class="bi {{ event.icon }}" aria-hidden="true"></i>
  <span class="lpw-event-copy"><span class="lpw-event-title">{% if not event.all_day %}<time datetime="{{ event.starts_at|date:'c' }}">{{ event.starts_at|date:'g:i A' }}</time>{% endif %}<strong>{{ event.name }}</strong>{% if event.warning %}<i class="bi bi-exclamation-triangle-fill" title="Action required"><span class="sr-only">Action required</span></i>{% endif %}</span><small>{{ event.session_type }} · {{ event.photographer }}</small><b>{{ event.status }}</b></span>
</button>
