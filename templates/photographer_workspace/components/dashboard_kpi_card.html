<article class="lpw-kpi-card" aria-label="{{ card.label }}"><span>{{ card.label }}</span><span class="lpw-widget-icon" aria-hidden="true"><i class="bi {{ card.icon }}"></i></span>{% if card.unavailable %}<strong class="is-unavailable">Not available</strong>{% else %}<strong>{{ card.value }}</strong>{% endif %}<small>{{ card.context }}</small>{% if card.change %}<em class="is-{{ card.trend }}"><i class="bi {% if card.trend == 'increase' %}bi-arrow-up-right{% elif card.trend == 'decrease' %}bi-arrow-down-right{% else %}bi-dash{% endif %}" aria-hidden="true"></i> {{ card.change }} <span>{{ card.comparison }}</span></em>{% else %}<em class="is-neutral"><i class="bi bi-dash" aria-hidden="true"></i> Comparison unavailable</em>{% endif %}</article>
