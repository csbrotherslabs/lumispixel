<section class="lpw-dashboard-error" role="alert" aria-labelledby="{{ state_id|default:'workspace-error' }}-title"><i class="bi {{ icon|default:'bi-exclamation-triangle' }}" aria-hidden="true"></i><div><h2 id="{{ state_id|default:'workspace-error' }}-title">{{ title }}</h2><p>{{ description }}</p></div>{% if retry_url %}<a class="lpw-btn" href="{{ retry_url }}">{{ retry_label|default:'Retry' }}</a>{% endif %}</section>
