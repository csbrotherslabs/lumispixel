{% load static %}
<aside class="lpw-sidebar" data-workspace-sidebar aria-label="Photographer Workspace navigation">
  <div class="lpw-brand">
    <a href="{% url 'core:index' %}" aria-label="LumisPixel home"><img src="{% static 'img/logo-orange.svg' %}" alt="LumisPixel"></a>
    <button class="lpw-sidebar-toggle" type="button" data-workspace-collapse aria-label="Collapse navigation" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10.5 6 4.5 12l6 6m9-12-6 6 6 6"/></svg>
    </button>
    <button class="lpw-drawer-close" type="button" data-workspace-close aria-label="Close navigation">×</button>
  </div>
  <nav class="lpw-nav" aria-label="Workspace modules">
    {% for group in workspace_nav %}
      <section class="lpw-nav-group{% if not group.title %} lpw-nav-group--standalone{% endif %}{% if group.active %} is-active{% endif %}" data-nav-group>
        {% if group.title %}
          <button class="lpw-nav-group__toggle" type="button" aria-expanded="{% if group.expanded %}true{% else %}false{% endif %}" aria-controls="{{ group.id }}" aria-label="{{ group.title }}" data-tooltip="{{ group.title }}" data-nav-group-toggle>
            <i class="bi {{ group.icon }} lpw-section-icon" aria-hidden="true"></i>
            <span>{{ group.title }}</span>
            <i class="bi bi-chevron-right lpw-group-chevron" aria-hidden="true"></i>
          </button>
        {% endif %}
        <div class="lpw-nav-group__items" id="{{ group.id }}"{% if group.title and not group.expanded %} hidden{% endif %}>
          {% for item in group.items %}
            <a href="{{ item.url }}" class="{% if item.active %}is-active{% endif %}" {% if item.active %}aria-current="page"{% endif %} data-tooltip="{{ item.title }}">
              <i class="bi {{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.title }}</span>
            </a>
          {% endfor %}
        </div>
      </section>
    {% endfor %}
  </nav>
</aside>
