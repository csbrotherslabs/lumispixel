{% load static %}
<aside class="lpw-sidebar" data-workspace-sidebar aria-label="Photographer Workspace navigation">
  <div class="lpw-brand"><img src="{% static 'img/logo-orange.svg' %}" alt="LumisPixel"><button class="lpw-drawer-close" type="button" data-workspace-close aria-label="Close navigation">×</button></div>
  <div class="lpw-identity">
    {% if identity.image_url %}<img src="{{ identity.image_url }}" alt="{{ identity.image_alt }}">{% else %}<span aria-hidden="true">{{ identity.initials }}</span>{% endif %}
    <div><strong>{{ identity.name }}</strong><small>Photographer Workspace</small></div>
  </div>
  <nav class="lpw-nav" aria-label="Workspace modules">
    {% for item in workspace_nav %}
      <a href="{{ item.url }}" class="{% if item.active %}is-active{% endif %}" {% if item.active %}aria-current="page"{% endif %}><i class="bi {{ item.icon }}" aria-hidden="true"></i><span>{{ item.title }}</span>{% if item.coming_soon %}<em>Soon</em>{% endif %}</a>
    {% endfor %}
  </nav>
</aside>
