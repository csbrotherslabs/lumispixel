<header class="lpw-topbar">
  <div class="lpw-topbar-start">
    <button class="lpw-menu-button" type="button" data-workspace-open aria-controls="workspace-sidebar" aria-label="Toggle navigation">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/></svg>
    </button>
    {% if not hide_topbar_heading %}<div class="lpw-page-heading"><p class="lpw-breadcrumb"><span>Photographer Workspace</span><i class="bi bi-chevron-right" aria-hidden="true"></i>{{ page_title }}</p><h1 id="workspace-page-title">{{ page_title }}</h1></div>{% endif %}
  </div>
  <form class="lpw-global-search" role="search" data-workspace-search>
    <i class="bi bi-search" aria-hidden="true"></i>
    <input type="search" aria-label="Search workspace" placeholder="Search workspace..." autocomplete="off" data-workspace-search-input>
    <kbd>⌘ K</kbd>
  </form>
  <div class="lpw-top-actions">
    <a class="lpw-icon-btn" href="{% url 'photographer_workspace:notifications' %}" aria-label="Notifications">
      <span class="lpw-notification-dot" aria-hidden="true"></span>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.857 17.082a23.85 23.85 0 0 0 5.454-1.31A8.967 8.967 0 0 1 18 9.75V9A6 6 0 0 0 6 9v.75a8.967 8.967 0 0 1-2.312 6.022 23.85 23.85 0 0 0 5.455 1.31m5.714 0a24.255 24.255 0 0 1-5.714 0m5.714 0a3 3 0 1 1-5.714 0"/></svg>
    </a>
    <a class="lpw-icon-btn lpw-help-btn" href="{% url 'photographer_workspace:help' %}" aria-label="Help and support"><i class="bi bi-question-circle" aria-hidden="true"></i></a>
    <div class="lpw-profile-menu" data-profile-menu>
      <button class="lpw-profile-trigger" type="button" data-profile-toggle aria-expanded="false" aria-haspopup="menu">
        {% if identity.image_url %}<img src="{{ identity.image_url }}" alt="{{ identity.image_alt }}">{% else %}<span class="lpw-profile-avatar" aria-hidden="true">{{ identity.initials }}</span>{% endif %}
        <span class="lpw-profile-copy"><strong>{{ identity.name }}</strong><small>Photographer</small></span>
        <svg class="lpw-profile-chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m19.5 8.25-7.5 7.5-7.5-7.5"/></svg>
      </button>
      <div class="lpw-profile-dropdown" role="menu" data-profile-dropdown hidden>
        <div class="lpw-dropdown-identity"><strong>{{ identity.name }}</strong><small>Photographer</small></div>
        <a role="menuitem" href="{% url 'photographer_workspace:profile' %}"><i class="bi bi-person"></i>My Profile</a>
        <a role="menuitem" href="{% url 'photographer_workspace:settings' %}"><i class="bi bi-building-gear"></i>Business Settings</a>
        <a role="menuitem" href="{% url 'photographer_workspace:notifications' %}"><i class="bi bi-bell"></i>Notifications</a>
        <a role="menuitem" href="{% url 'photographer_workspace:billing' %}"><i class="bi bi-credit-card"></i>Billing</a>
        <a role="menuitem" href="{% url 'photographer_workspace:help' %}"><i class="bi bi-question-circle"></i>Help</a>
        <form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button role="menuitem" type="submit"><i class="bi bi-box-arrow-right"></i>Sign Out</button></form>
      </div>
    </div>
  </div>
</header>
