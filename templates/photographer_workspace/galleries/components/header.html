<header class="lpw-clients-header lpw-gallery-header">
  <div class="lpw-clients-heading">
    <nav class="lpw-breadcrumb" aria-label="Breadcrumb"><span>Photographer Workspace</span><i class="bi bi-chevron-right"></i><span>Galleries</span><i class="bi bi-chevron-right"></i><strong>{{ page_title }}</strong></nav>
    <h1 id="workspace-page-title">{{ page_title }}</h1><p>{{ page_description }}</p>
  </div>
  {% if header_action_url %}<div class="lpw-clients-actions"><a class="lpw-btn lpw-btn-primary" href="{{ header_action_url }}"><i class="bi {{ header_action_icon }}"></i>{{ header_action_label }}</a></div>{% endif %}
</header>
