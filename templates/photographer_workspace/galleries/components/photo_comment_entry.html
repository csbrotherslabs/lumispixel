<div class="lp-preview-comment-entry{% if entry.parent_id %} is-reply{% endif %}">
  <span class="lp-preview-comment-avatar" aria-hidden="true">{{ entry.display_initials }}</span>
  <div class="lp-preview-comment-copy"><div class="lp-preview-comment-meta"><strong>{{ entry.display_author }}</strong>{% if entry.parent_id %}<span class="lp-preview-studio-label">Studio</span>{% endif %}<time datetime="{{ entry.created_at|date:'c' }}">{{ entry.created_at|timesince }} ago</time></div><p>{{ entry.body }}</p>
    <div class="lp-preview-comment-actions"><form method="post" action="{% url 'photographer_workspace:gallery_photo_comment_action' photo.pk entry.pk %}?page={{ comment_page.number }}&amp;sort={{ comment_sort }}" data-comment-reaction-form>{% csrf_token %}
      <button type="submit" name="action" value="like" aria-label="Like comment by {{ entry.display_author }}" aria-pressed="{% if entry.viewer_reactions.0.value == 1 %}true{% else %}false{% endif %}"><i class="bi bi-hand-thumbs-up" aria-hidden="true"></i> {{ entry.like_count }}</button>
      <button type="submit" name="action" value="dislike" aria-label="Dislike comment by {{ entry.display_author }}" aria-pressed="{% if entry.viewer_reactions.0.value == -1 %}true{% else %}false{% endif %}"><i class="bi bi-hand-thumbs-down" aria-hidden="true"></i> {{ entry.dislike_count }}</button>
    </form><button class="lp-preview-reply-trigger" type="button" data-comment-reply data-reply-author="{{ entry.display_author }}" data-reply-url="{% url 'photographer_workspace:gallery_photo_comment_action' photo.pk entry.pk %}" aria-label="Reply to {{ entry.display_author }}"><i class="bi bi-arrow-return-left" aria-hidden="true"></i> Reply</button></div>
  </div>
</div>
