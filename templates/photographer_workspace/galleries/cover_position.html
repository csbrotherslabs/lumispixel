<div class="lp-cover-position" data-cover-position>

  <p id="cover-position-hint">Drag in Reposition mode, or use the sliders. Save the gallery to keep your framing.</p>
  <label for="{{ form.cover_position_x.id_for_label }}">Horizontal position</label>{{ form.cover_position_x }}{{ form.cover_position_x.errors }}
  <label for="{{ form.cover_position_y.id_for_label }}">Vertical position</label>{{ form.cover_position_y }}{{ form.cover_position_y.errors }}
</div>
