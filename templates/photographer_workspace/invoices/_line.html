<div class="lpw-line-row" data-line><label><span class="sr-only">Item type</span><select name="item_type[]">{% for value,label in item_types %}<option value="{{ value }}"{% if line.item_type == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select><input name="item_description[]" value="{{ line.description }}" placeholder="Description" required></label><input aria-label="Quantity" name="item_quantity[]" type="number" min=".01" step=".01" value="{{ line.quantity|default:'1.00' }}" required><label class="money"><span>$</span><input aria-label="Unit price" name="item_unit_price[]" type="number" min="0" step=".01" value="{{ line.unit_price|default:'0.00' }}" required></label><label class="suffix"><input aria-label="Discount percentage" name="item_discount[]" type="number" min="0" max="100" step=".01" value="{{ line.discount_percent|default:'0.00' }}"><span>%</span></label><label class="suffix"><input aria-label="Tax percentage" name="item_tax[]" type="number" min="0" max="100" step=".01" value="{{ line.tax_percent|default:'0.00' }}"><span>%</span></label><strong data-line-total>$0.00</strong><button type="button" data-remove aria-label="Remove line item"><i class="bi bi-trash"></i></button></div>
