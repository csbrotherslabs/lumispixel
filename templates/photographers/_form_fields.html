{% for field in form %}
  <div class="form-group{% if field.field.widget.input_type == 'checkbox' %} lumis-onboarding__check-row{% endif %}">
    {% if field.field.widget.input_type == 'checkbox' %}
      {{ field }}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
    {% else %}
      <label for="{{ field.id_for_label }}">{{ field.label }}</label>
      {{ field }}
    {% endif %}
    {% if field.help_text %}<div class="lumis-onboarding__help">{{ field.help_text }}</div>{% endif %}
    {% if field.errors %}<div class="lumis-onboarding__error" id="{{ field.id_for_label }}-error" role="alert">{{ field.errors|striptags }}</div>{% endif %}
  </div>
{% endfor %}
