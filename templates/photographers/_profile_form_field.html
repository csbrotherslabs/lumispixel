<div class="form-group lumis-onboarding__profile-field{% if full_width %} lumis-onboarding__profile-field--full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}</label>
  {{ field }}
  {% if current_file %}<div class="lumis-onboarding__help">{{ current_label }}: <a href="{{ current_file.url }}">{{ current_file.name }}</a></div>{% endif %}
  {% if field.help_text %}<div class="lumis-onboarding__help">{{ field.help_text }}</div>{% endif %}
  {% if field.errors %}<div class="lumis-onboarding__error" id="{{ field.id_for_label }}-error" role="alert">{{ field.errors|striptags }}</div>{% endif %}
</div>
