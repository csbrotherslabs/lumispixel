<fieldset class="studio-client-card" data-client-row data-index="{{ item.index|default_if_none:'__index__' }}"><legend>Client</legend><input type="hidden" name="client_{{ item.index|default_if_none:'__index__' }}_id" value="{{ item.id|default:'' }}"><div class="studio-client-body"><div><div class="studio-client-logo">{% if item.image_url %}<img src="{{ item.image_url }}" alt="Current client logo">{% endif %}</div><label>Logo (optional)<input type="file" name="client_{{ item.index|default_if_none:'__index__' }}_image" accept="image/png,image/jpeg,image/webp"></label><label><input type="checkbox" name="client_{{ item.index|default_if_none:'__index__' }}_clear" value="1"> Remove logo</label></div><div><label>Client name<input class="form-control" name="client_{{ item.index|default_if_none:'__index__' }}_name" maxlength="120" value="{{ item.name|default:'' }}"></label><label>Website (optional)<input class="form-control" type="url" name="client_{{ item.index|default_if_none:'__index__' }}_url" maxlength="500" value="{{ item.url|default:'' }}"></label></div></div><div class="studio-client-actions"><button type="button" data-client-up>↑ Move up</button><button type="button" data-client-down>↓ Move down</button><button type="button" data-client-remove>Remove client</button></div></fieldset>
