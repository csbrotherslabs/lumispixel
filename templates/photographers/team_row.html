<article class="studio-client-card" data-team-row data-index="{{ item.index }}">
<div class="studio-client-header"><strong data-team-title>Team member</strong><div class="studio-client-actions"><button type="button" data-team-toggle aria-expanded="true">Collapse</button><button type="button" data-team-up aria-label="Move team member up">↑</button><button type="button" data-team-down aria-label="Move team member down">↓</button><button type="button" data-team-remove>Remove</button></div></div>
<input type="hidden" name="team_{{ item.index }}_id" value="{{ item.id|default:'' }}">
<div class="studio-client-body" data-team-body><div class="studio-client-media"><div class="studio-client-logo studio-team-photo">{% if item.image_url %}<img src="{{ item.image_url }}" alt="Team member photograph">{% else %}<span><i class="bi bi-person" aria-hidden="true"></i> Portrait preview</span>{% endif %}</div><label class="studio-client-upload">Profile photograph (optional)<input type="file" name="team_{{ item.index }}_image" accept="image/jpeg,image/png,image/webp"></label><label class="studio-client-clear"><input type="checkbox" name="team_{{ item.index }}_clear" value="1"> Remove photograph</label></div>
<div class="studio-client-fields"><label>Full name *<input name="team_{{ item.index }}_name" maxlength="120" placeholder="e.g. Alex Morgan" value="{{ item.name|default:'' }}"></label><label>Role or position *<input name="team_{{ item.index }}_role" maxlength="150" placeholder="e.g. Founder &amp; Lead Photographer" value="{{ item.role|default:'' }}"></label><label>Professional biography<textarea name="team_{{ item.index }}_bio" maxlength="2000" rows="3" placeholder="Describe their expertise and creative approach.">{{ item.bio|default:'' }}</textarea></label><label>Instagram profile (optional)<input type="url" name="team_{{ item.index }}_instagram" maxlength="500" placeholder="https://instagram.com/..." value="{{ item.instagram|default:'' }}"></label><label>Portfolio or website (optional)<input type="url" name="team_{{ item.index }}_url" maxlength="500" placeholder="https://..." value="{{ item.url|default:'' }}"></label></div></div></article>
